<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>示範頁面 - 使用模板</title>
    <link rel="stylesheet" href="{{path_prefix}}css/tailwind.css">
    <style>
        /* 共用樣式 */
        .site-banner {
            background-color: #f5f5f5;
            background-image: url('{{path_prefix}}images/hd-bg-lt.png'), url('{{path_prefix}}images/hd-bg-rt.png');
            background-position: left bottom, right bottom;
            background-repeat: no-repeat, no-repeat;
            background-size: auto 60%, auto 60%;
        }
        .site-sitemap { background-color: #efa22a; }
        .site-footer { background-color: #3e0f0f; }
        .site-nav {
            background-color: #671919;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .container-1200 { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* Navigation dropdown */
        .nav-item { position: relative; }
        .nav-item.has-dropdown > a::after {
            content: ' ▼';
            font-size: 0.7em;
            margin-left: 4px;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #671919;
            min-width: 180px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            padding: 0.5rem 0;
        }
        .nav-item:hover .dropdown-menu { display: block; }
        .dropdown-menu a {
            display: block;
            padding: 0.5rem 1.25rem;
            color: #ffffff;
        }
        .dropdown-menu a:hover { background-color: #991b1b; }
    </style>
</head>
<body>
    {{site-banner}}

    {{site-nav}}

    <!-- 頁面內容 -->
    <section class="py-4 bg-white">
        <div class="container-1200">
            <h2>這是您的頁面內容</h2>
            <p>在這裡放入您的內容...</p>
        </div>
    </section>

    {{site-sitemap}}

    {{site-footer}}
</body>
</html>
